[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-faq-chatbot"
version = "1.0.0"
description = "Local-first semantic FAQ chatbot (SQLite + FAISS + Sentence Transformers + Streamlit)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "streamlit==1.38.0",
    "sentence-transformers==3.0.1",
    "faiss-cpu==1.8.0",
    "numpy==1.26.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
