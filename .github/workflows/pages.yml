name: Publish Walk-Through Slides

# Builds the code walk-through into HTML slide decks with Marp and publishes them
# to GitHub Pages. A landing page links to the combined deck and every chapter.
#
# One-time setup (repo owner): Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". (The configure-pages step below also attempts to
# enable it automatically.)

on:
  push:
    branches: [main]
    paths:
      - "docs/walkthrough/**"
      - "scripts/build_slides.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

# Permissions required by the official Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-progress builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli@latest

      - name: Build slide decks
        env:
          MARP_CMD: marp
          OUT_DIR: ${{ github.workspace }}/_site/slides
        run: bash scripts/build_slides.sh

      - name: Generate landing page
        run: |
          slides_dir="_site/slides"
          index="_site/index.html"
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Semantic FAQ Chatbot — Code Walk-Through</title>'
            echo '<style>body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#1f2328}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}li{margin:.35rem 0}.hero{padding:1rem 1.25rem;border:1px solid #d0d7de;border-radius:12px;background:#f6f8fa}code{background:#eff1f3;padding:.1rem .35rem;border-radius:6px}@media(prefers-color-scheme:dark){body{background:#0d1117;color:#e6edf3}.hero{background:#161b22;border-color:#30363d}a{color:#58a6ff}code{background:#161b22}}</style>'
            echo '</head><body>'
            echo '<h1>💬 Semantic FAQ Chatbot — Code Walk-Through</h1>'
            echo '<p>A beginner-to-mastery tour of the codebase, rendered as slide decks.</p>'
            echo '<p class="hero">▶ <strong><a href="slides/walkthrough-full.html">Open the full deck (all chapters)</a></strong></p>'
            echo '<h2>Chapters</h2><ul>'
            for f in "$slides_dir"/[0-9][0-9]-*.html; do
              base="$(basename "$f" .html)"
              num="${base%%-*}"
              rest="${base#*-}"
              title="$(echo "$rest" | tr '-' ' ')"
              echo "<li><a href=\"slides/${base}.html\">Chapter ${num#0} — ${title}</a></li>"
            done
            echo '</ul>'
            echo '<p style="margin-top:2rem;color:#57606a">Source &amp; docs on <a href="https://github.com/kalyancn4u/faq-chatbot">GitHub</a>. Tip: use the arrow keys to move between slides.</p>'
            echo '</body></html>'
          } > "$index"
          echo "Generated $index"
          ls -la "$slides_dir"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
